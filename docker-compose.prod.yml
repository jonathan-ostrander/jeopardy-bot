version: '3.8'

services:
  jeopardy:
    build:
      context: .
      target: production
    container_name: jeopardy
    restart: unless-stopped
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - CLIENT_ID=${CLIENT_ID}
      - VITE_DISCORD_CLIENT_ID=${VITE_DISCORD_CLIENT_ID}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET}
      - PORT=${PORT:-3000}
      - ANSWER_SIMILARITY_THRESHOLD=${ANSWER_SIMILARITY_THRESHOLD:-0.8}
    volumes:
      # Only mount data directory in production
      - ./src/shared/data:/usr/src/app/src/shared/data
    networks:
      - caddy

  scraper:
    build:
      context: .
      target: production
    container_name: jeopardy-scraper
    environment:
      - ANSWER_SIMILARITY_THRESHOLD=${ANSWER_SIMILARITY_THRESHOLD:-0.8}
    volumes:
      - ./src/shared/data:/usr/src/app/src/shared/data
    command: ["bun", "run", "dist/scraper/index.js", "--recent", "10"]
    profiles:
      - scraper

networks:
  caddy:
    external: true
